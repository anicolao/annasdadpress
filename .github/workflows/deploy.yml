name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
      - run: npm test
        env:
          STATIC_ONLY: "1"
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  https:
    name: Verify HTTPS
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ vars.BASE_PATH == '' }}
    timeout-minutes: 5
    steps:
      - name: Verify the public certificate and HTTPS enforcement
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error --head --max-time 30 https://annasdadpress.com/
          enforced="$(gh api "repos/$REPOSITORY/pages" --jq '.https_enforced')"
          test "$enforced" = true
